name: Build APK
on:
  push:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Init submodules
        run: git submodule update --init --recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew :lemuroid-app:assembleFreeBundleDebug -PabiFilter=arm64-v8a --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lemuroid-custom
          path: lemuroid-app/build/outputs/apk/freeBundle/debug/*.apk 
