name: Build APK
on:
  push:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        run: chmod +x gradlew &&./gradlew :lemuroid-app:assembleFreeBundleDebug -PabiFilter=arm64-v8a
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lemuroid-custom
          path: lemuroid-app/build/outputs/apk/freeBundle/debug/*.apk
