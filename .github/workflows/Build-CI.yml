name: Build CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Release Keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > upload-keystore.jks

      - name: Write keystore.properties
        run: |
          cat > keystore.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build ARM64-only APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PabiFilter=arm64-v8a \
            --parallel \
            --build-cache \
            --no-daemon

      - name: Upload ARM64-only APK
        uses: actions/upload-artifact@v7
        env:
          NODE_OPTIONS: "--no-deprecation"
        with:
          name: lemuroid-arm64-v8a
          path: lemuroid-app/build/intermediates/apk/freeDynamic/release/lemuroid-app-free-dynamic-release.apk
          archive: false
          compression-level: 1

      - name: Build all-ABI APK
        run: |
          ./gradlew assembleRelease \
            --parallel \
            --build-cache \
            --no-daemon

      - name: Upload all-ABI APK
        uses: actions/upload-artifact@v7
        env:
          NODE_OPTIONS: "--no-deprecation"
        with:
          name: lemuroid-all-abi
          path: lemuroid-app/build/intermediates/apk/freeDynamic/release/lemuroid-app-free-dynamic-release.apk
          archive: false
          compression-level: 1